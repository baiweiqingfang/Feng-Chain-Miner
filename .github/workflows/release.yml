name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric-1.20.1
            project: versions/1.20.1/fabric
            java: 17
          - name: forge-1.20.1
            project: versions/1.20.1/forge
            java: 17
          - name: fabric-1.20.2
            project: versions/1.20.2/fabric
            java: 17
          - name: forge-1.20.2
            project: versions/1.20.2/forge
            java: 17
          - name: fabric-1.20.4
            project: versions/1.20.4/fabric
            java: 17
          - name: forge-1.20.4
            project: versions/1.20.4/forge
            java: 17
          - name: fabric-1.20.6
            project: versions/1.20.6/fabric
            java: 21
          - name: forge-1.20.6
            project: versions/1.20.6/forge
            java: 21
          - name: fabric-1.21.1
            project: versions/1.21.1/fabric
            java: 21
          - name: forge-1.21.1
            project: versions/1.21.1/forge
            java: 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p ${{ matrix.project }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.jar --generate-notes

