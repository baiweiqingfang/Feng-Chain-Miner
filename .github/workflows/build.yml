name: Build supported Minecraft versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric-1.20.1
            project: versions/1.20.1/fabric
            java: 17
            gradle: 8.11.1
          - name: forge-1.20.1
            project: versions/1.20.1/forge
            java: 17
            gradle: 8.11.1
          - name: fabric-1.20.2
            project: versions/1.20.2/fabric
            java: 17
            gradle: 8.11.1
          - name: forge-1.20.2
            project: versions/1.20.2/forge
            java: 17
            gradle: 8.11.1
          - name: fabric-1.20.4
            project: versions/1.20.4/fabric
            java: 17
            gradle: 8.11.1
          - name: forge-1.20.4
            project: versions/1.20.4/forge
            java: 17
            gradle: 8.11.1
          - name: fabric-1.20.6
            project: versions/1.20.6/fabric
            java: 21
            gradle: 8.11.1
          - name: forge-1.20.6
            project: versions/1.20.6/forge
            java: 21
            gradle: 8.11.1
          - name: fabric-1.21.1
            project: versions/1.21.1/fabric
            java: 21
            gradle: 8.11.1
          - name: forge-1.21.1
            project: versions/1.21.1/forge
            java: 21
            gradle: 8.11.1
          - name: fabric-1.21.3
            project: versions/1.21.3/fabric
            java: 21
            gradle: 8.11.1
          - name: forge-1.21.3
            project: versions/1.21.3/forge
            java: 21
            gradle: 8.11.1
          - name: fabric-1.21.4
            project: versions/1.21.4/fabric
            java: 21
            gradle: 8.11.1
          - name: forge-1.21.4
            project: versions/1.21.4/forge
            java: 21
            gradle: 8.11.1
          - name: fabric-1.21.5
            project: versions/1.21.5/fabric
            java: 21
            gradle: 8.12.1
          - name: forge-1.21.5
            project: versions/1.21.5/forge
            java: 21
            gradle: 8.12.1
          - name: fabric-1.21.8
            project: versions/1.21.8/fabric
            java: 21
            gradle: 8.14.3
          - name: forge-1.21.8
            project: versions/1.21.8/forge
            java: 21
            gradle: 8.14.3
          - name: fabric-1.21.10
            project: versions/1.21.10/fabric
            java: 21
            gradle: 8.14.3
          - name: forge-1.21.10
            project: versions/1.21.10/forge
            java: 25
            gradle: 9.3.1
          - name: fabric-1.21.11
            project: versions/1.21.11/fabric
            java: 25
            gradle: 9.3.1
          - name: forge-1.21.11
            project: versions/1.21.11/forge
            java: 25
            gradle: 9.3.1
          - name: fabric-26.1
            project: versions/26.1/fabric
            java: 25
            gradle: 9.6.0
          - name: forge-26.1
            project: versions/26.1/forge
            java: 25
            gradle: 9.6.0
          - name: fabric-26.2
            project: versions/26.2/fabric
            java: 25
            gradle: 9.6.0
          - name: forge-26.2
            project: versions/26.2/forge
            java: 25
            gradle: 9.6.0
          - name: fabric-26.3
            project: versions/26.3/fabric
            java: 25
            gradle: 9.6.0
          - name: forge-26.3
            project: versions/26.3/forge
            java: 25
            gradle: 9.6.0
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle --no-daemon -p ${{ matrix.project }} build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar

