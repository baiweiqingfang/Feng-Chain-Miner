name: Build supported Minecraft versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric-1.20.1
            project: versions/1.20.1/fabric
            java: 17
          - name: forge-1.20.1
            project: versions/1.20.1/forge
            java: 17
          - name: fabric-1.20.2
            project: versions/1.20.2/fabric
            java: 17
          - name: forge-1.20.2
            project: versions/1.20.2/forge
            java: 17
          - name: fabric-1.20.4
            project: versions/1.20.4/fabric
            java: 17
          - name: forge-1.20.4
            project: versions/1.20.4/forge
            java: 17
          - name: fabric-1.20.6
            project: versions/1.20.6/fabric
            java: 21
          - name: forge-1.20.6
            project: versions/1.20.6/forge
            java: 21
          - name: fabric-1.21.1
            project: versions/1.21.1/fabric
            java: 21
          - name: forge-1.21.1
            project: versions/1.21.1/forge
            java: 21
          - name: fabric-1.21.3
            project: versions/1.21.3/fabric
            java: 21
          - name: forge-1.21.3
            project: versions/1.21.3/forge
            java: 21
          - name: fabric-1.21.4
            project: versions/1.21.4/fabric
            java: 21
          - name: forge-1.21.4
            project: versions/1.21.4/forge
            java: 21
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew -p ${{ matrix.project }} build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar

