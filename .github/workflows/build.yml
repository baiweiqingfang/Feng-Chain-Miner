name: Build Minecraft 1.20.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric-1.20.1
            project: versions/1.20.1/fabric
            java: 17
          - name: forge-1.20.1
            project: versions/1.20.1/forge
            java: 17
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew -p ${{ matrix.project }} build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar

